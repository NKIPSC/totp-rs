name: Run cargo test

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      
      - name: Run tests
        run: cargo test --all-features


