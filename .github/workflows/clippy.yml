name: Check formatting

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      
      - name: Check formatting
        run: cargo clippy -- -D warnings


